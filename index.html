<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lingo-Ville · Under Construction</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Fonts: Inter + Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0b2b4a;
            --primary-light: #1a4068;
            --secondary: #f5a623;
            --accent: #e85d3a;
            --cream: #fcf8f0;
            --gray: #6b7a8a;
            --white: #ffffff;
            --shadow: 0 8px 32px rgba(11, 43, 74, 0.12);
            --radius: 20px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cream);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: radial-gradient(circle at 20% 30%, rgba(245, 166, 35, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(232, 93, 58, 0.05) 0%, transparent 50%);
            position: relative;
        }

        /* subtle animated background decoration */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(245, 166, 35, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(232, 93, 58, 0.02) 0%, transparent 40%);
            animation: floatBg 30s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatBg {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            100% {
                transform: translate(2%, 1%) rotate(2deg);
            }
        }

        /* ===== MAIN CARD ===== */
        .construction-card {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 56px 48px 48px;
            box-shadow: var(--shadow), 0 0 0 1px rgba(255, 255, 255, 0.6);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: var(--transition);
        }

        .construction-card:hover {
            box-shadow: 0 16px 48px rgba(11, 43, 74, 0.16), 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        /* ===== LOGO ===== */
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
            text-decoration: none;
        }

        .logo i {
            color: var(--secondary);
            font-size: 2.4rem;
        }

        .logo span {
            color: var(--secondary);
        }

        /* ===== ICON / ILLUSTRATION ===== */
        .construction-icon {
            font-size: 4.8rem;
            color: var(--secondary);
            margin: 16px 0 8px;
            display: block;
            animation: pulseIcon 2.4s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.08) rotate(4deg);
            }
        }

        /* ===== TYPOGRAPHY ===== */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            font-weight: 700;
            margin: 8px 0 12px;
            line-height: 1.2;
        }

        h1 span {
            color: var(--secondary);
            position: relative;
        }

        h1 span::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 8px;
            background: rgba(245, 166, 35, 0.2);
            border-radius: 8px;
            z-index: -1;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--gray);
            max-width: 440px;
            margin: 0 auto 8px;
            line-height: 1.7;
        }

        .subtitle strong {
            color: var(--primary);
            font-weight: 600;
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--secondary), var(--accent));
            border-radius: 4px;
            margin: 24px auto 28px;
        }

        /* ===== COUNTDOWN (optional decorative) ===== */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 8px 0 32px;
        }

        .countdown .unit {
            background: rgba(11, 43, 74, 0.04);
            border-radius: 14px;
            padding: 8px 16px 6px;
            min-width: 70px;
            border: 1px solid rgba(11, 43, 74, 0.04);
        }

        .countdown .unit .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .countdown .unit .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--gray);
            font-weight: 600;
        }

        /* ===== BUTTON ===== */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 18px 44px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.05rem;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            background: var(--secondary);
            color: var(--primary);
            box-shadow: 0 4px 16px rgba(245, 166, 35, 0.30);
            text-decoration: none;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: #e89c1a;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 32px rgba(245, 166, 35, 0.40);
        }

        .btn-primary i {
            font-size: 1rem;
            transition: var(--transition);
        }

        .btn-primary:hover i {
            transform: translateX(4px);
        }

        /* ===== FOOTER NOTE ===== */
        .footer-note {
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer-note a {
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
            border-bottom: 1px dotted transparent;
        }

        .footer-note a:hover {
            color: var(--secondary);
            border-bottom-color: var(--secondary);
        }

        .footer-note .sep {
            color: rgba(107, 122, 138, 0.2);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .construction-card {
                padding: 36px 24px 32px;
            }

            h1 {
                font-size: 2.1rem;
            }

            .logo {
                font-size: 1.7rem;
            }

            .logo i {
                font-size: 1.9rem;
            }

            .construction-icon {
                font-size: 3.6rem;
            }

            .countdown {
                gap: 10px;
            }

            .countdown .unit {
                min-width: 56px;
                padding: 6px 10px 4px;
            }

            .countdown .unit .number {
                font-size: 1.4rem;
            }

            .btn-primary {
                padding: 14px 28px;
                font-size: 0.95rem;
                width: 100%;
                justify-content: center;
            }

            .subtitle {
                font-size: 1rem;
            }

            .footer-note {
                font-size: 0.75rem;
                flex-direction: column;
                gap: 6px;
            }

            .footer-note .sep {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .construction-card {
                padding: 28px 16px 24px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .countdown .unit {
                min-width: 44px;
                padding: 4px 6px 2px;
            }

            .countdown .unit .number {
                font-size: 1.1rem;
            }

            .countdown .unit .label {
                font-size: 0.55rem;
            }
        }
    </style>
</head>
<body>

    <div class="construction-card">

        <!-- Logo -->
        <a href="#" class="logo" aria-label="Lingo-Ville home">
            <i class="fas fa-globe-americas"></i>
            Lingo<span>Ville</span>
        </a>

        <!-- Icon -->
        <span class="construction-icon" aria-hidden="true">
            <i class="fas fa-hard-hat"></i>
        </span>

        <!-- Heading -->
        <h1>
            We're <span>building</span> something<br class="hide-mobile" /> amazing
        </h1>

        <p class="subtitle">
            <strong>Lingo-Ville</strong> is getting a fresh new look.
            Our main site is currently under construction while we polish every detail.
        </p>

        <div class="divider"></div>

        <!-- Countdown (decorative / placeholder) -->
        <div class="countdown" id="countdown">
            <div class="unit">
                <div class="number" id="days">--</div>
                <div class="label">Days</div>
            </div>
            <div class="unit">
                <div class="number" id="hours">--</div>
                <div class="label">Hours</div>
            </div>
            <div class="unit">
                <div class="number" id="minutes">--</div>
                <div class="label">Minutes</div>
            </div>
            <div class="unit">
                <div class="number" id="seconds">--</div>
                <div class="label">Seconds</div>
            </div>
        </div>

        <!-- CTA Button -->
        <a href="https://cert.lingo-ville.com" class="btn-primary" target="_blank" rel="noopener noreferrer">
            <span>Visit Certification Portal</span>
            <i class="fas fa-arrow-right"></i>
        </a>

        <!-- Footer note -->
        <div class="footer-note">
            <span>📬 <a href="mailto:hello@lingoville.com">hello@lingoville.com</a></span>
            <span class="sep">·</span>
            <span>📍 123 Language Ave, NYC</span>
            <span class="sep">·</span>
            <span>© 2026 Lingo-Ville</span>
        </div>

    </div>

    <!-- ===== COUNTDOWN SCRIPT (decorative, counts to a target date) ===== -->
    <script>
        (function() {
            // Set a target date: 30 days from now (you can change this)
            const now = new Date();
            const target = new Date(now);
            target.setDate(target.getDate() + 30);
            // Optionally set a fixed future date, e.g.:
            // const target = new Date('2026-10-15T00:00:00');

            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');

            function padZero(n) {
                return String(n).padStart(2, '0');
            }

            function updateCountdown() {
                const now = new Date();
                let diff = target - now;

                if (diff <= 0) {
                    daysEl.textContent = '00';
                    hoursEl.textContent = '00';
                    minutesEl.textContent = '00';
                    secondsEl.textContent = '00';
                    return;
                }

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                diff -= days * (1000 * 60 * 60 * 24);
                const hours = Math.floor(diff / (1000 * 60 * 60));
                diff -= hours * (1000 * 60 * 60);
                const minutes = Math.floor(diff / (1000 * 60));
                diff -= minutes * (1000 * 60);
                const seconds = Math.floor(diff / 1000);

                daysEl.textContent = padZero(days);
                hoursEl.textContent = padZero(hours);
                minutesEl.textContent = padZero(minutes);
                secondsEl.textContent = padZero(seconds);
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        })();
    </script>

</body>
</html>
