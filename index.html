<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page Not Found · Lingo‑Ville Certificate Verification</title>
    <meta name="description" content="The page you're looking for doesn't exist. Verify a Lingo‑Ville certificate instead." />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#00aba5" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

    <style>
        /* ===== RESET ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --teal: #00aba5;
            --teal-600: #008984;
            --teal-700: #006762;
            --teal-50: #e6f7f6;
            --orange: #F8A233;
            --orange-600: #e6821f;
            --slate-900: #0f172a;
            --slate-600: #475569;
            --slate-400: #94a3b8;
            --slate-100: #f1f5f9;
            --white: #ffffff;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Nunito', system-ui, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: var(--slate-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* subtle animated background decoration */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 30% 40%, rgba(0, 171, 165, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 70% 60%, rgba(248, 162, 51, 0.04) 0%, transparent 40%);
            animation: floatBg 30s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatBg {
            0%   { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(2%, 1%) rotate(2deg); }
        }

        /* ===== CARD ===== */
        .error-card {
            position: relative;
            z-index: 1;
            max-width: 640px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 56px 48px 44px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
            transition: var(--transition);
        }

        .error-card:hover {
            box-shadow: 0 16px 48px rgba(15, 23, 42, 0.12);
        }

        /* ===== LOGO ===== */
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--slate-900);
            margin-bottom: 28px;
            text-decoration: none;
            transition: var(--transition);
        }

        .logo img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--white);
            padding: 2px;
            object-fit: contain;
        }

        .logo:hover {
            transform: translateY(-2px);
        }

        .logo .accent {
            color: var(--orange);
        }

        /* ===== 404 NUMBER ===== */
        .error-code {
            font-family: 'Nunito', sans-serif;
            font-size: 6.5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -4px;
            background: linear-gradient(135deg, var(--teal) 0%, var(--orange) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px;
            animation: pulseCode 3s ease-in-out infinite;
        }

        @keyframes pulseCode {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.03); }
        }

        /* ===== TYPOGRAPHY ===== */
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 12px;
            color: var(--slate-900);
        }

        .subtitle {
            font-size: 1rem;
            color: var(--slate-600);
            max-width: 420px;
            margin: 0 auto 32px;
            line-height: 1.7;
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 64px;
            height: 3px;
            background: linear-gradient(90deg, var(--teal), var(--orange));
            border-radius: 4px;
            margin: 0 auto 32px;
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 320px;
            margin: 0 auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-primary {
            background: var(--teal);
            color: var(--white);
            box-shadow: 0 4px 16px rgba(0, 171, 165, 0.25);
        }

        .btn-primary:hover {
            background: var(--teal-600);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 171, 165, 0.35);
        }

        .btn-secondary {
            background: transparent;
            color: var(--slate-600);
            border: 2px solid var(--slate-100);
        }

        .btn-secondary:hover {
            border-color: var(--teal);
            color: var(--teal-700);
            background: var(--teal-50);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            transition: var(--transition);
        }

        .btn:hover svg {
            transform: translateX(2px);
        }

        /* ===== FOOTER NOTE ===== */
        .footer-note {
            margin-top: 36px;
            padding-top: 24px;
            border-top: 1px solid var(--slate-100);
            font-size: 0.8rem;
            color: var(--slate-400);
            line-height: 1.8;
        }

        .footer-note a {
            color: var(--slate-600);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .footer-note a:hover {
            color: var(--teal-700);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .error-card {
                padding: 40px 24px 32px;
                border-radius: 20px;
            }

            .error-code {
                font-size: 5rem;
                letter-spacing: -3px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .subtitle {
                font-size: 0.9rem;
                margin-bottom: 24px;
            }

            .logo {
                font-size: 1.25rem;
            }

            .logo img {
                width: 34px;
                height: 34px;
            }

            .btn {
                padding: 13px 24px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 380px) {
            .error-code {
                font-size: 4rem;
            }
            h1 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="error-card">

        <!-- Logo -->
        <a href="/" class="logo" aria-label="Lingo‑Ville home">
            <img src="/logo.png" alt="" onerror="this.style.display='none'" />
            <span>Lingo<span class="accent">Ville</span></span>
        </a>

        <!-- 404 Number -->
        <div class="error-code">404</div>

        <!-- Heading -->
        <h1>Page not found</h1>

        <p class="subtitle">
            The page you're looking for doesn't exist, has been moved, or the link is broken.
            If you were trying to verify a certificate, use the search box below.
        </p>

        <div class="divider"></div>

        <!-- Buttons -->
        <div class="btn-group">
            <a href="https://cert.lingo-ville.com" class="btn btn-primary">
                <span>Verify a Certificate</span>
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </a>
            <a href="https://lingo-ville.com" class="btn btn-secondary">
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>Main Website</span>
            </a>
        </div>

        <!-- Footer Note -->
        <div class="footer-note">
            Need help?
            <a href="mailto:contact@lingo-ville.com">contact@lingo-ville.com</a>
            · +216 22 571 291
            <br />
            Sfax, Tunisia
        </div>

    </div>

</body>
</html>
